services:
  - type: web
    name: base
    env: docker
    region: Frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: bash start.sh
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_API
        sync: false
      - key: TELEGRAM_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OWNER_ID
        sync: false
      - key: UPSTREAM_REPO
        sync: false
      - key: UPSTREAM_BRANCH
        sync: false
